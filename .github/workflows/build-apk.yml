name: Build APK own key
on: workflow_dispatch
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.5}
      - name: Android SDK
        run: |
          SM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
      - name: Unzip source
        run: |
          unzip -o *.zip -d _src
          cp -r _src/whenplay-premium/. .
          rm -rf _src
          rm -f *.zip
      - name: Own signing key
        run: |
          if [ ! -f app/tunex.keystore ]; then
            keytool -genkeypair -v -keystore app/tunex.keystore -alias tunex -keyalg RSA -keysize 2048 -validity 10000 -storepass tunex123 -keypass tunex123 -dname "CN=WhenPlay Premium, O=WhenPlay, C=IN"
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git add app/tunex.keystore
            git commit -m "own signing key"
            git push || true
          fi
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: WhenPlay-Premium-APK, path: "app/build/outputs/apk/debug/*.apk"}
