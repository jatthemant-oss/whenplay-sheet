name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.5}
      - name: Android SDK
        run: |
          SM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
      - name: Unzip source
        run: |
          unzip -o *.zip -d _src
          cp -r _src/whenplay-premium/. .
          rm -rf _src
          rm -f *.zip
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "source" || true
          git push || true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: WhenPlay-Premium-APK, path: "app/build/outputs/apk/debug/*.apk"}
